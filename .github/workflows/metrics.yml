name: Update GitHub Metrics
on:
  # Schedule updates (each day)
  schedule: [{ cron: "0 0 * * *" }]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  # push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    name: Generate metrics 🛠
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ⏬
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 📊 Personal metrics svg
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: JitishxD
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: metrics.svg

          plugin_languages: yes
          plugin_languages_ignored: html
          repositories_skipped: |
            JitishxD/forge-api-docs
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: no
          plugin_languages_colors: github
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: lines, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          plugin_languages_indepth_custom: JitishxD/GFG-160
          # plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: programming
          plugin_languages_recent_load: 1000
          plugin_languages_recent_days: 365
          commits_authoring: |
            Jitesh Goyal
            JitishxD
            166510314+JitishxD@users.noreply.github.com
            JitishxD@users.noreply.github.com
            jitish08@gmail.com
            JitishxD <jitish08@gmail.com>

      - name: Lifetime contributions svg 📅
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0

      - name: LeetCode Stats svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.leetcode.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: JitishxD
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 10
          plugin_leetcode_limit_recent: 3

      - name: Move output to working directory 📦
        run: sudo mv /metrics_renders/*.svg .

      - name: Commit to the repo ⬆️
        run: |
          git config --global user.email "Jitish08+bot@gmail.com"
          git config --global user.name "JitishBot"
          git add *.svg
          #git commit -a -m "[Github Actions] Updated Stats svgs"
          git commit --amend --no-edit
          git push -f
